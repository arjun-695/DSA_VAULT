<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="33%" stop-color="#fbbf24"/>
      <stop offset="66%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { r: 6; opacity: 0.8; }
      50% { r: 9; opacity: 1; }
    }
    .node-p { animation: pulse-node 2s ease-in-out infinite; }
  </style>

  <rect width="900" height="280" rx="16" fill="url(#bg3)" stroke="rgba(255,255,255,0.1)"/>

  <!-- Title -->
  <text x="450" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SPACED REPETITION MEMORY RETENTION ENGINE
  </text>
  <text x="450" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Automated intervals prevent memory decay according to the Ebbinghaus Forgetting Curve
  </text>

  <!-- Axes -->
  <path d="M 80 80 L 80 220 L 840 220" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="40" y="150" font-family="sans-serif" font-size="11" fill="#94a3b8" transform="rotate(-90 40 150)" text-anchor="middle">Retention %</text>
  <text x="460" y="245" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Time &amp; Review Intervals (Days)</text>

  <!-- Without Spaced Repetition (Decay Curve) -->
  <path d="M 80 90 Q 180 200 400 215" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="250" y="195" font-family="sans-serif" font-size="10" fill="#f87171" text-anchor="middle">Without Review (Memory Forgetting Curve)</text>

  <!-- With Spaced Repetition (Review Curves) -->
  <!-- Day 0 -> Day 1 Review -->
  <path d="M 80 90 Q 140 180 200 180" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <!-- Day 1 Review Spike -->
  <path d="M 200 180 L 200 95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M 200 95 Q 290 150 380 150" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Day 7 Review Spike -->
  <path d="M 380 150 L 380 95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M 380 95 Q 520 125 660 125" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Day 30 Review Spike -->
  <path d="M 660 125 L 660 95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M 660 95 Q 740 100 820 98" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Review Nodes -->
  <!-- Day 0 -->
  <circle cx="80" cy="90" r="6" fill="#f43f5e"/>
  <text x="80" y="75" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f43f5e" text-anchor="middle">Solved</text>

  <!-- Day 1: Daily -->
  <circle cx="200" cy="95" r="7" fill="#fbbf24" class="node-p"/>
  <text x="200" y="75" font-family="sans-serif" font-weight="bold" font-size="11" fill="#fbbf24" text-anchor="middle">1st Review (Daily)</text>

  <!-- Day 7: Weekly -->
  <circle cx="380" cy="95" r="7" fill="#38bdf8" class="node-p"/>
  <text x="380" y="75" font-family="sans-serif" font-weight="bold" font-size="11" fill="#38bdf8" text-anchor="middle">2nd Review (Weekly)</text>

  <!-- Day 30: Monthly -->
  <circle cx="660" cy="95" r="7" fill="#34d399" class="node-p"/>
  <text x="660" y="75" font-family="sans-serif" font-weight="bold" font-size="11" fill="#34d399" text-anchor="middle">3rd Review (Monthly)</text>

  <!-- Mastered Status -->
  <rect x="790" y="80" width="80" height="30" rx="15" fill="rgba(52, 211, 153, 0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="830" y="100" font-family="sans-serif" font-weight="bold" font-size="11" fill="#34d399" text-anchor="middle">MASTERED</text>
</svg>
