<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Space Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-brand" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .g-glow { animation: pulse-glow 4s ease-in-out infinite; transform-origin: center; }
    .badge-float-1 { animation: float-badge 3.5s ease-in-out infinite; }
    .badge-float-2 { animation: float-badge 4.2s ease-in-out infinite 0.5s; }
    .badge-float-3 { animation: float-badge 3.8s ease-in-out infinite 1s; }
    .flowing-line { stroke-dasharray: 8 6; animation: dash-flow 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Decorative Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow-brand)" class="g-glow"/>
  <circle cx="1000" cy="320" r="220" fill="#c084fc" opacity="0.1" filter="url(#glow-brand)" class="g-glow"/>
  <circle cx="600" cy="200" r="150" fill="#34d399" opacity="0.08" filter="url(#glow-brand)"/>

  <!-- Decorative Circuit Lines -->
  <path d="M 50 210 L 250 210 L 320 280 L 880 280 L 950 210 L 1150 210" fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="2"/>
  <path d="M 50 210 L 250 210 L 320 280 L 880 280 L 950 210 L 1150 210" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-line" opacity="0.6"/>

  <!-- Main Hero Glass Card -->
  <rect x="180" y="50" width="840" height="320" rx="20" fill="url(#glass-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Brand Title Header -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Icon Shield -->
    <g transform="translate(0, -35)">
      <polygon points="0,-24 22,-12 22,14 0,26 -22,14 -22,-12" fill="url(#brand-grad)" opacity="0.9" filter="url(#glow-cyan)"/>
      <path d="M -8,-5 L 0,-13 L 8,-5 M 0,-13 L 0,10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#brand-grad)" letter-spacing="3">
      DSA VAULT
    </text>
    <text y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="1">
      Local-First Problem Tracker &amp; Spaced Repetition Engine
    </text>
  </g>

  <!-- Feature Badges Row -->
  <!-- Badge 1: 0 API Quota -->
  <g class="badge-float-1" transform="translate(230, 230)">
    <rect width="210" height="60" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <circle cx="30" cy="30" r="14" fill="rgba(52, 211, 153, 0.2)"/>
    <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">⚡</text>
    <text x="56" y="27" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">0 API Quota</text>
    <text x="56" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">yt-dlp Extraction</text>
  </g>

  <!-- Badge 2: Spaced Repetition -->
  <g class="badge-float-2" transform="translate(480, 230)">
    <rect width="240" height="60" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <circle cx="30" cy="30" r="14" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">🔄</text>
    <text x="56" y="27" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Spaced Repetition</text>
    <text x="56" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Ebbinghaus Revision</text>
  </g>

  <!-- Badge 3: Local First -->
  <g class="badge-float-3" transform="translate(760, 230)">
    <rect width="210" height="60" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <circle cx="30" cy="30" r="14" fill="rgba(192, 132, 252, 0.2)"/>
    <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">🔒</text>
    <text x="56" y="27" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Local-First DB</text>
    <text x="56" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Dexie.js + Offline</text>
  </g>

  <!-- Bottom Pills Row -->
  <g transform="translate(600, 335)" text-anchor="middle">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text y="5" font-family="monospace" font-size="12" fill="#cbd5e1">
      <tspan fill="#38bdf8">Next.js 15</tspan> • <tspan fill="#818cf8">TypeScript</tspan> • <tspan fill="#34d399">Tailwind</tspan> • <tspan fill="#c084fc">Zustand</tspan> • <tspan fill="#f43f5e">Visx Heatmap</tspan>
    </text>
  </g>
</svg>
